deploy_llvm-job:
  stage: deploy_llvm
  needs:
    - build_llvm-job
    - run_llvm_tests-job
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH # TODO - We may need to do this on a pull request?
      changes:
        paths:
          - .git/modules/llvm-project/refs/heads/$CI_COMMIT_BRANCH
        compare_to: $MAIN_BRANCH
  script:
    - cd $LLVM_BUILD_DIR
    - cmake --build . --target install -j$BUILD_PROCESSORS
  artifacts:
    paths:
      - $LLVM_INSTALL_DIR

deploy_python-job:
  stage: deploy_llvm
  needs:
    - build_llvm-job
    - run_llvm_tests-job
  rules:
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH # TODO - We may need to do this on a pull request?
      changes:
        paths:
          - llvm-project/llvm/utils/hakc/requirements.txt
        compare_to: $MAIN_BRANCH
  script:
    - echo "Setting up python virtual environment at PYTHON_DEPLOY_DIR"
    - python3 -m venv PYTHON_DEPLOY_DIR
    - source $PYTHON_DEPLOY_DIR/bin/activate
    - python3 -m pip install -r $CI_PROJECT_DIR/llvm-project/llvm/utils/hakc/requirements.txt
    - deactivate
  artifacts:
    paths:
      - $PYTHON_DEPLOY_DIR
