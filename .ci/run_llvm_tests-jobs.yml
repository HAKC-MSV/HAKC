run_llvm_tests-job:
  stage: run_llvm_tests
  needs:
    - job: build_llvm-job
  rules:
    - !reference [ .llvm_settings, rules ]
  variables:
    !reference [ .llvm_settings, variables ]
  script:
    - echo "Setting up python virtual env at $PYTHON_VENV_DIR"
    - python3 -m venv $PYTHON_VENV_DIR
    - source $PYTHON_VENV_DIR/bin/activate
    - pip install -r llvm-project/llvm/utils/hakc/requirements.txt
    - echo "Running LLVM Tests"
    - cmake --build $LLVM_BUILD_DIR --target check-llvm -j$BUILD_PROCESSORS
