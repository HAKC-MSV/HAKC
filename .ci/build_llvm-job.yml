build_llvm-job:
  stage: build_llvm
  rules:
    !reference [ .llvm_settings, rules ]
  variables:
    !reference [ .llvm_settings, variables ]
  script:
    - echo "Building LLVM into $LLVM_BUILD_DIR from $CI_PROJECT_DIR"
    - cmake --preset release
    - cmake --build $LLVM_BUILD_DIR -j$BUILD_PROCESSORS
  artifacts:
    paths:
      - $LLVM_BUILD_DIR
      - $CI_PROJECT_DIR/llvm-project
