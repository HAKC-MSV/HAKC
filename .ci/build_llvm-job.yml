build_llvm-job:
  stage: build_llvm
  rules:
    !reference [ .llvm_settings, rules ]
  variables:
    !reference [ .llvm_settings, variables ]
  script:
    - echo "Building LLVM into $LLVM_BUILD_DIR from $CI_PROJECT_DIR"
    - mkdir -p $LLVM_BUILD_DIR
    - cd $LLVM_BUILD_DIR
    - cmake -G Ninja -DCMAKE_INSTALL_PREFIX=$LLVM_INSTALL_DIR -DCMAKE_BUILD_TYPE=Release -DLLVM_ENABLE_ASSERTIONS=On -DLLVM_ENABLE_PROJECTS='clang;clang-tools-extra;lld' -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLLVM_TARGETS_TO_BUILD='X86;AArch64;ARM' -DLLVM_USE_LINKER=lld -DLLVM_ENABLE_HAKC=On -DLLVM_BUILD_TESTS=On -DHAKC_PYTHON_VENV=$PYTHON_VENV_DIR -DHAKC_SOCKET_ROOT=$TEST_SOCKET_PATH $CI_PROJECT_DIR
    - cmake --build . -j$BUILD_PROCESSORS
  artifacts:
    paths:
      - $LLVM_BUILD_DIR
      - $CI_PROJECT_DIR/llvm-project
