build_llvm-job:
  stage: build_llvm
  needs:
    - job: submodule_consistency-job
  rules:
    - changes:
        paths:
          - .git/modules/llvm-project/HEAD
          - scripts/llvm-cmake.sh
        compare_to: 'main'
  script:
    - echo "Building LLVM into $LLVM_BUILD_DIR"
    - GIT_CURL_VERBOSE=1 GIT_TRACE=1 git submodule init llvm-project
    - GIT_CURL_VERBOSE=1 GIT_TRACE=1 git submodule update
    - mkdir -p $LLVM_BUILD_DIR
    - cd $LLVM_BUILD_DIR
    - export CMAKE_INIT_LINE="
      cmake -G Ninja
      -DCMAKE_INSTALL_PREFIX=$(realpath $CLANG_BUILD_PATH)
      -DCMAKE_BUILD_TYPE=Release
      -DLLVM_ENABLE_ASSERTIONS=On
      $(grep -v '^#' $CI_PROJECT_DIR/scripts/llvm-cmake.sh)
      $CI_PROJECT_DIR"
    - exec $CMAKE_INIT_LINE
    - cmake --build . -j$BUILD_PROCESSORS
