build_linux-armv9_pass-job:
  stage: pre_build
  needs:
    - job: submodule_consistency-job
    - job: build_llvm-job
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $STAGING_BRANCH
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $NEXT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $MAIN_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $DEV_BRANCH && $CI_COMMIT_BRANCH !~ $EXT_BRANCH # manual build for internal dev branches
      when: manual
  script:
    - export CLANG_BUILD_PATH="$HAKC_CLANG_PATH/build/$CI_COMMIT_BRANCH/"
    - export CLANG_DEPLOY_PATH="$HAKC_CLANG_PATH/deploy/"
    - export BUILD_TYPE="linux-armv9"
    - echo "Checking which clang to use"
    - |
      if [ -d "$CLANG_BUILD_PATH" ] && [ ! -z "$CI_COMMIT_BRANCH" ]; then
        export CLANG_PATH=$(realpath $CLANG_BUILD_PATH)
      else
        export CLANG_PATH=$(realpath $CLANG_DEPLOY_PATH)
      fi
    - echo "Using $CLANG_PATH"
    - |
      echo "Checking current pass revision"
      cd HAKC-pass
      IFS=' ' read -ra commit_string_array <<< `git log src | head -n 1`
      export PASS_ID=${commit_string_array[1]:0:8}
      cd ..
    - echo "$BUILD_TYPE, $PASS_ID"
    - export ARTIFACT_PATH="/data/gitlab-runner/artifact_stage/$BUILD_TYPE/HAKC-pass/$PASS_ID" install
    - echo "Checking if current pass was already built for $BUILD_TYPE"
    - |
      if [ -d $ARTIFACT_PATH ]; then
        echo "current pass already built, copying into place"
        mkdir -p install
        cp -r $ARTIFACT_PATH/* install
        exit 0
      else
        # build pass normally
        echo "current pass not already built, continuing with build"
      fi
    - echo "Building HAKC compiler pass (ARM v9)"
    - mkdir cmake-build-hakc-pass-$BUILD_TYPE
    - cd cmake-build-hakc-pass-$BUILD_TYPE
    - |
      cmake -G Ninja \
      -DCMAKE_INSTALL_PREFIX=$(realpath ..)/install \
      -DCMAKE_BUILD_TYPE=RelWithDebInfo \
      -DLT_LLVM_INSTALL_DIR=$CLANG_PATH \
      -DCMAKE_C_COMPILER=$CLANG_PATH/bin/clang \
      -DCMAKE_CXX_COMPILER=$CLANG_PATH/bin/clang++ \
      -DHAKC_LINUX_ARMV9=True \
      ..
    - cmake --build . -j$BUILD_PROCESSORS --target install
    - cd ..
    # put copy in artifact stage area
    - mkdir -p $ARTIFACT_PATH
    - cp -r install/* $ARTIFACT_PATH
  artifacts:
    paths:
      - install
