# Skeleton of a job to test in a dev branch
# Don't edit before EDIT BELOW HERE (except the name) unless you REALLY mean to
development-job:
  rules:
    - if: $CI_COMMIT_BRANCH =~ $DEV_BRANCH && $CI_COMMIT_BRANCH !~ $EXT_BRANCH # only internal dev branches
      variables:
        BRANCH_TYPE: "branch-dev"
      when: never # TODO - change this back
    - if: $CI_COMMIT_BRANCH !~ $DEV_BRANCH
      variables:
        BRANCH_TYPE: $CI_COMMIT_BRANCH
      when: never
  script:
    - |
      if [ $BRANCH_TYPE != "branch-dev" ]
      then
        echo "This shouldn't be running in a non-dev branch..."
        exit 1
      fi
      ############# EDIT BELOW HERE ####################
    - echo "Change me to what you need me to do"
  stage: check # change me to the stage you need
