SYSTEMINFO:
  ARCH:             armv9
  PLATFORM:         Linux
  METHODS:
    - NAME:         GetNoTransferFunctions
      FUNCTIONS:
        - "__bpf_call_base"
        - "ftrace_stub"
        - "ftrace_stub_graph"
        - "ftrace_call"
        - "parse_memtest"
        - "__stack_chk_fail"
        - "is_vmalloc_addr"
        - "page_to_phys"
        - "vmalloc_to_page"
        - "virt_to_pfn"
        - "raid6_int4_xor_syndrome"
        - "raid6_int1_gen_syndrome"
        - "raid6_int2_xor_syndrome"
        - "raid6_int8_gen_syndrome"
