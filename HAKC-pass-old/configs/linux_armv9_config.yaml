        - "cpu_switch_to"
        - "__pi_clear_page"
        - "clear_page"
        - "__clear_page"
        - "__pi_copy_page"
        - "copy_page"
        - "__copy_page"
        - "__pi_memchr"
        - "memchr"
        - "__memchr"
        - "__pi_memcpy"
        - "memcpy"
        - "__memcpy"
        - "__pi_memmove"
        - "memmove"
        - "__memmove"
        - "__pi_memset"
