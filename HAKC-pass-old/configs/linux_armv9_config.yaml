        - "__strnlen"
        - "__pi_strrchr"
        - "strrchr"
        - "__strrchr"
        - "__arch_clear_user"
        - "__ashlti3"
        - "__ashrti3"
        - "__lshrti3"
        - "memcmp"
        - "strcmp"
        - "strchr"
        - "memset"
    - NAME:          GetIgnoredTypes
      FUNCTIONS:
        - "struct.list_head"
        - "struct.proto"
        - "struct.atomic64_s"
        - "struct.atomic_s"
    - NAME:          GetIgnoredGlobals
      FUNCTIONS:
        - "kmalloc_caches"
