linux_v5-armv8_rosdemo_dag_adjustment-job:
  stage: dag_v5
  needs:
    - job: linux_v5-armv8_rosdemo_dag_analysis-job
  rules:
    - if: $CI_COMMIT_BRANCH == $STAGING_BRANCH
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $NEXT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $DEV_BRANCH && $CI_COMMIT_BRANCH !~ $EXT_BRANCH # manual build for internal dev branches
      when: on_success # Will run once build-kernel is kicked off
  variables:
    BUILD_TYPE: "linux-armv8"
    HAKC_DAG_ROOT: "build-$BUILD_TYPE/hakc-dag-analysis"
  script:
    - |
      export DEMO_NAME="rosdemo"
      cd HAKC-pass
      IFS=' ' read -ra pass_commit_string_array <<< `git log src | head -n 1`
      export PASS_ID=${pass_commit_string_array[1]:0:8}
      cd ..
      cd linux-patches/v5.15
      IFS=' ' read -ra patchset_commit_string_array <<< `git log . | head -n 1`
      export PATCHSET_ID=${patchset_commit_string_array[1]:0:8}
      cd ../..
      # after config generated
      cd build-$BUILD_TYPE
      IFS=' ' read -ra config_hash_string_array <<< `sha256sum .config | head -n 1`
      export CONFIG_ID=${config_hash_string_array[0]:0:8}
      cd ..
      cd scripts/ros2-demo
      IFS=' ' read -ra adjyml_hash_string_array <<< `sha256sum rosdemo-compartments.yml | head -n 1`
      export ADJYML_ID=${adjyml_hash_string_array[0]:0:8}
      cd ../..
      export ARTIFACT_PATH="/data/gitlab-runner/artifact_stage/$BUILD_TYPE/$DEMO_NAME/$PASS_ID/$PATCHSET_ID/$CONFIG_ID/$ADJYML_ID"
      if [ -d $ARTIFACT_PATH ]; then
        # this dag has been generated previously, copy HAKC_DAG_ROOT and config into expected location
        mkdir -p build-$BUILD_TYPE/hakc-dag-analysis
        cp -r $ARTIFACT_PATH/hakc-compartments.yml $HAKC_DAG_ROOT
        cp $ARTIFACT_PATH/.config build-$BUILD_TYPE
        exit 0
      else
        echo "this has not been done before, continuing with build"
      fi
    - echo "Creating / Applying compartmentalization modifications"
    - sed "s+_KERNEL_SOURCE_+$(realpath linux)+g" scripts/ros2-demo/rosdemo-compartments.yml |
      sed "s+_KERNEL_BUILD_+$(realpath build-$BUILD_TYPE)+g" > $HAKC_DAG_ROOT/hakc-ros2-adjustments.yml
    - python3 scripts/analysis/data-access-analysis.py -c $HAKC_DAG_ROOT/dag.bin
      --adjust $HAKC_DAG_ROOT/hakc-ros2-adjustments.yml
    - echo "Outputing compartmentalization policy"
    - python3 scripts/analysis/data-access-analysis.py -c $HAKC_DAG_ROOT/dag-adjusted.bin
      --output_compart $HAKC_DAG_ROOT/hakc-compartments.yml
    # copy to artifact_stage 
    - mkdir -p $ARTIFACT_PATH
    - cp $HAKC_DAG_ROOT/hakc-compartments.yml $ARTIFACT_PATH
    - cp build-$BUILD_TYPE/.config $ARTIFACT_PATH
  artifacts:
    paths:
      - $HAKC_DAG_ROOT/hakc-compartments.yml
      - build-$BUILD_TYPE/.config
  dependencies:
    - linux_v5-armv8_rosdemo_dag_analysis-job
