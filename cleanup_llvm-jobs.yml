.cleanup_llvm-job: &cleanup_llvm-job
  stage: cleanup
  script:
    - export CLANG_BUILD_PATH="$HAKC_CLANG_PATH/build/$CI_COMMIT_BRANCH/"
    - echo "Removing $CLANG_BUILD_PATH"
    - rm -rf $CLANG_BUILD_PATH

cleanup_llvm_failure:
  needs: 
    - job: build_llvm-job
    - job: build_linux_v6-armv8-btree_rosdemo_compartmentalized_kernel-job
    - job: build_linux_v6-armv8-memory_rosdemo_compartmentalized_kernel-job
    - job: build_linux_v6-armv9_rosdemo_compartmentalized_kernel-job
    - job: build_linux_v6-x86-btree_rosdemo_compartmentalized_kernel-job
    - job: build_linux_v6-x86-memory_rosdemo_compartmentalized_kernel-job
    - job: deploy_llvm-job
      optional: true
  rules:
    - changes:
        paths: 
          - llvm-patches/*.patches
        compare_to: 'main'
  when: on_failure
  <<: *cleanup_llvm-job

cleanup_llvm_success:
  needs:
    - build_linux_v6-armv8-btree_rosdemo_compartmentalized_kernel-job
    - build_linux_v6-armv8-memory_rosdemo_compartmentalized_kernel-job
    - build_linux_v6-armv9_rosdemo_compartmentalized_kernel-job
    - build_linux_v6-x86-btree_rosdemo_compartmentalized_kernel-job
    - build_linux_v6-x86-memory_rosdemo_compartmentalized_kernel-job
    # These will run after deploy if applicable
  rules:
    - if: $CI_COMMIT_BRANCH != $MAIN_BRANCH
      changes:
        paths: 
          - llvm-patches/*.patches
        compare_to: 'main'
  when: on_success
  <<: *cleanup_llvm-job
