name: Set up HAKC build environment
description: Checks out sources and sets environment
inputs:
  ref_sha:
    description: Git commit to checkout
    required: false
    default: ""
  dependencies_to_install:
    description: Packages needed to install
    required: false
    default: ""
  cmake_preset:
    description: CMake Preset to configure
    required: false
    default: ""
  submodules_to_init:
    description: Submodules to initialize
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Initialize Submodules
      if: ${{ inputs.submodules_to_init != '' }}
      shell: bash
      run: |
        set -euo pipefail
        
        for submodule in ${{ inputs.submodules_to_init }}; do
          git submodule update --init --recursive -- "$submodule"
        done

    - name: Prepare workspace
      shell: bash
      run: |
        set -euo pipefail
        
        chown -R root:root .
    - name: Install Dependencies
      if: ${{ inputs.dependencies_to_install != '' }}
      shell: bash
      run: |
        set -euo pipefail
        
        apt update
        apt install -y ${{ inputs.dependencies_to_install }}
    - name: Configure CMake
      if: ${{ inputs.cmake_preset != '' }}
      shell: bash
      run: |
        set -euo pipefail
        
        cmake --preset ${{ inputs.cmake_preset }}
