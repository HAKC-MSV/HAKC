name: "Check Kernel Image Exists"
description: "Check whether a kernel image tag exists in JFrog."

inputs:
  reg_host:
    required: true
    description:
  repo_id:
    required: true
    description:
  kernel_image_id:
    required: true
    description:
  jfrog_user:
    required: true
    description:
  jfrog_pass:
    required: true
    description:
  det_tag:
    required: true
    description:

outputs:
  exists:
    value: ${{ steps.check.outputs.exists }}
    description:
  http_code:
    value: ${{ steps.check.outputs.http_code }}
    description:

runs:
  using: "composite"
  steps:
    - name: Check if Kernel Image exists in JFrog
      id: check
      shell: bash
      env:
        REG_HOST: ${{ inputs.reg_host }}
        REPOID: ${{ inputs.repo_id }}
        KERNEL_IMAGEID: ${{ inputs.kernel_image_id }}
        DET_TAG: ${{ inputs.det_tag }}
        jfrog_user: ${{ inputs.jfrog_user }}
        jfrog_pass: ${{ inputs.jfrog_pass }}
      run: |
        set -euo pipefail

        url="https://${REG_HOST}/artifactory/api/docker/${REPOID}/v2/${KERNEL_IMAGEID}/manifests/${DET_TAG}"
        echo "Checking kernel image: $url"

        code="$(curl -sS -u "${jfrog_user}:${jfrog_pass}" \
          -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
          -o /dev/null -w '%{http_code}' -I "$url" || true)"

        EXISTS="false"
        case "$code" in
          200)
            EXISTS="true"
            echo "Kernel image already exists in registry (HTTP $code)"
            ;;
          404)
            EXISTS="false"
            echo "Kernel image not found in registry (HTTP $code) - will build"
            ;;
          401|403)
            echo "Auth failure checking registry (HTTP $code) — treating as not exists so we rebuild." >&2
            EXISTS="false"
            ;;
          *)
            echo "Unexpected HTTP $code — treating as not exists so we rebuild." >&2
            EXISTS="false"
            ;;
        esac

        echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
        echo "http_code=$code" >> "$GITHUB_OUTPUT"
        echo "exists=$EXISTS"
        echo "http_code=$code"
