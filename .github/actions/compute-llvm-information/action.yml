name: "Compute LLVM Information"
description: "Detect LLVM submodule changes, compute deterministic tag, and check registry image existence."

inputs:
  reg_host:
    required: true
    description: "Artifactory URL"
  repo_id:
    required: true
    description: "Artifactory repository ID"
  llvm_image_id:
    required: true
    description: "Artifactory LLVM Image to use"
  jfrog_user:
    required: true
    description: "Artifactory username for authentication"
  jfrog_pass:
    required: true
    description: "Artifactory password for authentication"
  submodule_path:
    required: false
    default: "llvm-project"
    description: "Path of submodule within repository"

outputs:
  changed:
    value: ${{ steps.compute.outputs.changed }}
    description: "True if LLVM changed from target branch"
  sha:
    value: ${{ steps.compute.outputs.sha }}
    description: "LLVH SHA"
  tag:
    value: ${{ steps.compute.outputs.tag }}
    description: "LLVM Artifactory tage"
  hit:
    value: ${{ steps.compute.outputs.hit }}
    description: "True if built LLVM artifact exists"
  http_code:
    value: ${{ steps.compute.outputs.http_code }}
    description: "HTTP Code when checking Artifactory"
  rebuild:
    value: ${{ steps.compute.outputs.rebuild }}
    description: "True if LLVM needs rebuilding"
  python_venv_cache_key:
    value: ${{ steps.compute.outputs.python_venv_cache_key }}
    description: "Python venv cache key"

runs:
  using: "composite"
  steps:
    - name: Compute LLVM Information
      id: compute
      shell: bash
      env:
        REG_HOST: ${{ inputs.reg_host }}
        REPOID: ${{ inputs.repo_id }}
        LLVM_IMAGEID: ${{ inputs.llvm_image_id }}
        jfrog_user: ${{ inputs.jfrog_user }}
        jfrog_pass: ${{ inputs.jfrog_pass }}
        SUBMODULE_PATH: ${{ inputs.submodule_path }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GITHUB_BEFORE: ${{ github.event.before }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        set -euo pipefail

        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          BASE_SHA="$GITHUB_BASE_SHA"
          HEAD_SHA="$GITHUB_HEAD_SHA"
        else
          BASE_SHA="$GITHUB_BEFORE"
          HEAD_SHA="$GITHUB_SHA"
        fi

        echo "Comparing base: $BASE_SHA  head: $HEAD_SHA"

        # New branch / force-push edge case
        if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          changed="true"
        else
          base_gitlink="$(git rev-parse -q --verify "${BASE_SHA}:${SUBMODULE_PATH}" 2>/dev/null || true)"
          head_gitlink="$(git rev-parse -q --verify "${HEAD_SHA}:${SUBMODULE_PATH}" 2>/dev/null || true)"

          echo "Base llvm gitlink: $base_gitlink"
          echo "Head llvm gitlink: $head_gitlink"

          changed="true"
          if [[ -n "$base_gitlink" && -n "$head_gitlink" && "$base_gitlink" == "$head_gitlink" ]]; then
            changed="false"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
        fi

        SHA="$(git rev-parse -q --verify "${GITHUB_SHA}:${SUBMODULE_PATH}" 2>/dev/null || true)"
        if [[ -z "$SHA" ]]; then
          echo "ERROR: could not read gitlink for ${SUBMODULE_PATH} from ${GITHUB_SHA}" >&2
          exit 1
        fi
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"

        BRANCH_TAG="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
        TAG="llvm-${RUNNER_OS}-${BRANCH_TAG}-${SHA}"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        url="https://${REG_HOST}/artifactory/api/docker/${REPOID}/v2/${LLVM_IMAGEID}/manifests/${TAG}"
        echo "Checking image: $url"

        code="$(curl -sS -u "${jfrog_user}:${jfrog_pass}" \
          -H 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
          -o /dev/null -w '%{http_code}' -I "$url" || true)"

        HIT="false"
        case "$code" in
          200)
            HIT="true"
            ;;
          404)
            HIT="false"
            ;;
          401|403)
            echo "Auth failure checking registry (HTTP $code) — treating as miss so we rebuild." >&2
            HIT="false"
            ;;
          *)
            echo "Unexpected HTTP $code — treating as miss so we rebuild." >&2
            HIT="false"
            ;;
        esac

        echo "hit=$HIT" >> "$GITHUB_OUTPUT"
        echo "http_code=$code" >> "$GITHUB_OUTPUT"

        if [[ "$changed" == "false" && "$HIT" == "true" ]]; then
          rebuild="false"
        else
          rebuild="true"
        fi

        python_venv_cache_key="venv-${RUNNER_OS}-${SHA}"
        echo "python_venv_cache_key=$python_venv_cache_key" >> "$GITHUB_OUTPUT"
        echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

        echo "event:                  $GITHUB_EVENT_NAME"
        echo "rebuild:                $rebuild"
        echo "tag:                    $TAG"
        echo "python_venv_cache_key:  $python_venv_cache_key"
