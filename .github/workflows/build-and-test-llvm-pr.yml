name: Build-and-Test-LLVM

env:
  http_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  https_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  no_proxy: ".llan.ll.mit.edu,localhost,127.0.0.1,172.25.4.225,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
  IMAGEID: "g53-hakc-llvm"
  REPOURL: "ett-jfrog.llan.ll.mit.edu"
  REPOID: "g0553-docker-local"
  BUILD_DIR: "cmake-build-hakc-release"
  DEPS_TO_INSTALL: "clang ninja-build cmake busybox-static lld python3-venv"
  VENV_DIR: "python/venv"
  INSTALL_DIR: "hakc"

on:
  pull_request:
    branches:
      - main
      - next

jobs:
  build-and-test:
    name: Build & Test (runs on PRs and on push)
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch so base SHA is resolvable
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # fetch the remote base branch so git ls-tree on the base SHA works
          git fetch origin "+refs/heads/${{ github.event.pull_request.base.ref }}:refs/remotes/origin/${{ github.event.pull_request.base.ref }}"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .

      - name: Detect LLVM submodule pointer change
        id: llvm_changed
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE_PATH="llvm-project"

          # compare PR head vs target branch (base)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Comparing base: $BASE_SHA  head: $HEAD_SHA"

          # If base is empty (first commit) treat as changed
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_gitlink="$(git ls-tree "$BASE_SHA" "$SUBMODULE_PATH" 2>/dev/null | awk '{print $3}' || true)"
          head_gitlink="$(git ls-tree "$HEAD_SHA" "$SUBMODULE_PATH" 2>/dev/null | awk '{print $3}' || true)"

          echo "Base llvm gitlink: $base_gitlink"
          echo "Head llvm gitlink: $head_gitlink"

          if [[ -n "$base_gitlink" && -n "$head_gitlink" && "$base_gitlink" == "$head_gitlink" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get LLVM submodule SHA (head)
        id: llvm_sha
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the explicit HEAD_SHA when available, otherwise use git submodule status
          sha="$(git ls-tree "${{ github.event.pull_request.head.sha }}" llvm-project | awk '{print $3}' || true)"
          if [[ -z "$sha" ]]; then
            sha="$(git submodule status llvm-project | awk '{print $1}' | sed 's/^-//')"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Decide whether to rebuild
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.llvm_changed.outputs.changed }}" == "true" ]]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
          echo "LLVM changed: ${{ steps.llvm_changed.outputs.changed }}"

      - name: Install Dependencies
        if: steps.rebuild.outputs.rebuild == 'true'
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Build Clang/LLVM
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-release
          cmake --build $BUILD_DIR -- -j $(nproc)

      - name: Run Unit Tests (check-llvm)
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target check-llvm
