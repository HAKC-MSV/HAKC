name: Test latest build and tag latest

env:
  http_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  https_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  no_proxy: ".llan.ll.mit.edu,localhost,127.0.0.1,172.25.4.225,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
  LLVM_IMAGEID: "g53-hakc-llvm"
  KERNEL_IMAGEID: "g53-hakc-linux"
  REPOURL: "ett-jfrog.llan.ll.mit.edu"
  REPOID: "g0553-docker-local"
  LINUX_ARCH: "x86_64"
  jfrog_user: ${{ secrets.JFROG_USER }}
  jfrog_pass: ${{ secrets.JFROG_PASS }}
  TAG_NAME: "amd64-${{ github.event.pull_request.head.sha || github.sha }}"
  COMMIT_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
  check-for-built-image:
    name: Check for built kernel
    runs-on: [ arc-runner-set-llcad-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}
          submodules: 'false'
      - name: Search for built image
        id: image_check
        uses: ./.github/actions/check-if-image-exists-in-jfrog
        with:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          reg_host: ${{ env.REPOURL }}
          repo_id: ${{ env.REPOID }}
          kernel_image_id: ${{ env.KERNEL_IMAGEID }}
          det_tag: ${{ env.TAG_NAME }}

      - name: Fail if built image does not exist
        if: steps.image_check.outputs.exists == 'false'
        run: |
          echo "Built image does not exist. Failing job."
          exit 1
  
  test-hakc-kernel-qemu:
    name: Test HAKC Kernel with QEMU
    runs-on: [ arc-runner-set-llcad-prod ]
    needs: [ check-for-built-image ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/g0553-docker-local/g53-hakc-linux:amd64-${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}
          submodules: 'false'
      - name: Test HAKC Kernel with QEMU
        uses: ./.github/actions/run-hakc-kernel-in-qemu
        with:
          linux_arch: ${{ env.LINUX_ARCH }}
          kernel_path: "/opt/hakc-linux/vmlinuz-6.14.0-hakc"
          root_fs_path: "/opt/hakc-linux/rootfs.img"
          kernel_cmd_args: "console=ttyS0 init=/sbin/init root=/dev/vda rw hakc_test=rosdemo nokaslr"
          search_string_1: "Oops: general protection fault, probably for non-canonical address"
          search_string_2: "HAKC_ORIG_my_open"
          search_string_3: "HAKC_TEST_RESULT rc=139"
          timeout_seconds: 60

  tag-latest-image:
    name: Tag build with latest
    runs-on: [ arc-runner-set-llcad-prod ]
    needs: [ test-hakc-kernel-qemu ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.COMMIT_SHA }}
          submodules: 'false'
      - name: Promote image to latest
        uses: ./.github/actions/pull-docker-image-and-tag
        with:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          repo_url: ${{ env.REPOURL }}
          repo_id: ${{ env.REPOID }}
          image_id: g53-hakc-linux
          source_tag: ${{ env.TAG_NAME }}
          target_tag: latest


