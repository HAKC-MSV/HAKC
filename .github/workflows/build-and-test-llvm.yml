name: Build-And-Test-LLVM
env:
  http_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  https_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  no_proxy: ".llan.ll.mit.edu,localhost,127.0.0.1,172.25.4.225,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
  IMAGEID: "g53-hakc-llvm"
  REPOURL: "ett-jfrog.llan.ll.mit.edu"
  REPOID: "g0553-docker-local"
  TAGID: "amd64-${{ github.run_id }}"
  ADDITIONAL_TAGID: "latest"
  PLATFORM_TAGID: "amd64-latest"
  BUILD_DIR: "cmake-build-hakc-release"
  DEPS_TO_INSTALL: "clang ninja-build cmake busybox-static lld python3-venv"
  VENV_DIR: "python/venv"
  INSTALL_DIR: "hakc"
on:
  push:
    branches:
      - github-actions-dev
  workflow_dispatch:

jobs:
  DetectLLVMChange:
    runs-on: [ arc-runner-set-llcad-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    outputs:
      llvm_sha: ${{ steps.detect.outputs.llvm_sha }}
    steps:
      - name: Checkout (no submodules needed)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Detect LLVM submodule change
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          chown -R root:root .

          SUBMODULE_PATH="llvm-project"

          HEAD="${{ github.sha }}"
          
          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            # workflow_dispatch: best effort
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          # Read the gitlink (submodule pointer) from each tree
          base_sha="$(git ls-tree "$BASE" "$SUBMODULE_PATH" | awk '{print $3}' || true)"
          head_sha="$(git ls-tree "$HEAD" "$SUBMODULE_PATH" | awk '{print $3}' || true)"

          echo "Base submodule SHA: $base_sha"
          echo "Head submodule SHA: $head_sha"

          # Also output the current SHA to use for caching keys
          echo "llvm_sha=$head_sha" >> "$GITHUB_OUTPUT"
  BuildLLVM:
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    needs: DetectLLVMChange
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Install Dependencies
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL
      - name: Restore LLVM build cache
        id: llvm_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: llvm-${{ runner.os }}-${{ needs.DetectLLVMChange.outputs.llvm_sha }}-${{ hashFiles('CMakePresets.json', 'CMakeLists.txt') }}
      # If cache-hit, we can skip configure/build entirely.
      - name: Configure Build Environment
        if: steps.llvm_cache.outputs.cache-hit != 'true'
        run: |
          cmake --preset ci-release
      - name: Build Clang
        if: steps.llvm_cache.outputs.cache-hit != 'true'
        run: |
          cmake --build $BUILD_DIR -- -j $(nproc)
  TestLLVM:
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    needs: [ DetectLLVMChange, BuildLLVM ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Restore LLVM build cache
        id: llvm_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: llvm-${{ runner.os }}-${{ needs.DetectLLVMChange.outputs.llvm_sha }}-${{ hashFiles('CMakePresets.json', 'CMakeLists.txt') }}
      - name: Install Dependencies
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL
      - name: Run Unit Tests
        run: |
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target check-llvm
  CreateLLVMContainer:
    runs-on: [ arc-runner-set-llcad-prod ]
    needs: [ DetectLLVMChange, TestLLVM ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Restore LLVM build cache
        id: llvm_cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: llvm-${{ runner.os }}-${{ needs.DetectLLVMChange.outputs.llvm_sha }}-${{ hashFiles('CMakePresets.json', 'CMakeLists.txt') }}
      - name: Install Dependencies
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL
      - name: Install LLVM
        run: |
          cmake --build $BUILD_DIR --target install -- -j $(nproc)
      - name: Build Image
        run: |
          envsubst < Dockerfile.template > Dockerfile
          export _BUILDAH_STARTED_IN_USERNS="" 
          export BUILDAH_ISOLATION=chroot

          buildah login -u $jfrog_user -p $jfrog_pass $REPOURL          
          buildah bud  --storage-driver vfs -t $REPOURL/$REPOID/$IMAGEID:$TAGID . 
          buildah push --storage-driver vfs    $REPOURL/$REPOID/$IMAGEID:$TAGID 
          buildah tag  --storage-driver vfs    $REPOURL/$REPOID/$IMAGEID:$TAGID $REPOURL/$REPOID/$IMAGEID:$ADDITIONAL_TAGID
          buildah push --storage-driver vfs    $REPOURL/$REPOID/$IMAGEID:$ADDITIONAL_TAGID
          buildah tag  --storage-driver vfs    $REPOURL/$REPOID/$IMAGEID:$TAGID $REPOURL/$REPOID/$IMAGEID:$PLATFORM_TAGID
          buildah push --storage-driver vfs    $REPOURL/$REPOID/$IMAGEID:$PLATFORM_TAGID
