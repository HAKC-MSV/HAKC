name: Build-And-Test-LLVM

env:
  http_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  https_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  no_proxy: ".llan.ll.mit.edu,localhost,127.0.0.1,172.25.4.225,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
  IMAGEID: "g53-hakc-llvm"
  REPOURL: "ett-jfrog.llan.ll.mit.edu"
  REPOID: "g0553-docker-local"
  BUILD_DIR: "cmake-build-hakc-release"
  DEPS_TO_INSTALL: "clang ninja-build cmake busybox-static lld python3-venv"
  VENV_DIR: "python/venv"
  INSTALL_DIR: "hakc"

on:
  push:
    branches:
      - github-actions-dev
  workflow_dispatch:

jobs:
  BuildTestInstallImage:
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Detect LLVM submodule pointer change
        id: llvm_changed
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .
          SUBMODULE_PATH="llvm-project"
          HEAD="${{ github.sha }}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            BASE="${{ github.event.before }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          fi

          if [[ "$BASE" == "0000000000000000000000000000000000000000" || -z "$BASE" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha="$(git ls-tree "$BASE" "$SUBMODULE_PATH" | awk '{print $3}' || true)"
          head_sha="$(git ls-tree "$HEAD" "$SUBMODULE_PATH" | awk '{print $3}' || true)"

          echo "Base llvm gitlink: $base_sha"
          echo "Head llvm gitlink: $head_sha"

          if [[ -n "$base_sha" && -n "$head_sha" && "$base_sha" == "$head_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get LLVM submodule SHA
        id: llvm_sha
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git submodule status llvm-project | awk '{print $1}' | sed 's/^-//')" >> "$GITHUB_OUTPUT"

      - name: Decide whether to rebuild
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.llvm_changed.outputs.changed }}" == "true" ]]; then
            echo "rebuild=true" >> "$GITHUB_OUTPUT"
          else
            echo "rebuild=false" >> "$GITHUB_OUTPUT"
          fi
          echo "LLVM changed: ${{ steps.llvm_changed.outputs.changed }}"
          echo "rebuild:      $(cat "$GITHUB_OUTPUT" | tail -n 1 | cut -d= -f2)"

      - name: Install Dependencies
        if: steps.rebuild.outputs.rebuild == 'true'
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Build Clang/LLVM
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-release
          cmake --build $BUILD_DIR -- -j $(nproc)

      - name: Run Unit Tests (check-llvm)
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target check-llvm

      - name: Install LLVM
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target install -- -j $(nproc)

      - name: Build & Push Image (rebuild)
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        env:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          COMMIT_TAG: "amd64-${{ github.sha }}"
          LATEST_TAG: "amd64-latest"
        run: |
          set -euo pipefail
          envsubst < Dockerfile-llvm.template > Dockerfile
          export _BUILDAH_STARTED_IN_USERNS=""
          export BUILDAH_ISOLATION=chroot
          
          buildah login -u "$jfrog_user" -p "$jfrog_pass" "$REPOURL"
          
          # Build with commit tag
          buildah bud  --storage-driver vfs -t "$REPOURL/$REPOID/$IMAGEID:$COMMIT_TAG" .
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$IMAGEID:$COMMIT_TAG"
          
          # Update amd64-latest as a moving pointer (optional but useful)
          buildah tag  --storage-driver vfs    "$REPOURL/$REPOID/$IMAGEID:$COMMIT_TAG" "$REPOURL/$REPOID/$IMAGEID:$LATEST_TAG"
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$IMAGEID:$LATEST_TAG"

      - name: Publish commit tag without rebuild
        if: steps.rebuild.outputs.rebuild != 'true'
        shell: bash
        env:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          COMMIT_TAG: "amd64-${{ github.sha }}"
          LATEST_TAG: "amd64-latest"
        run: |
          set -euo pipefail
          export _BUILDAH_STARTED_IN_USERNS=""
          export BUILDAH_ISOLATION=chroot
          
          buildah login -u "$jfrog_user" -p "$jfrog_pass" "$REPOURL"
          
          # Pull the current baseline image and re-tag it for this commit
          buildah pull --storage-driver vfs "$REPOURL/$REPOID/$IMAGEID:$LATEST_TAG"
          buildah tag  --storage-driver vfs "$REPOURL/$REPOID/$IMAGEID:$LATEST_TAG" "$REPOURL/$REPOID/$IMAGEID:$COMMIT_TAG"
          buildah push --storage-driver vfs "$REPOURL/$REPOID/$IMAGEID:$COMMIT_TAG"
