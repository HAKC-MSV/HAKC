name: Build, Test, and Publish LLVM

env:
  http_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  https_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  no_proxy: ".llan.ll.mit.edu,localhost,127.0.0.1,172.25.4.225,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
  LLVM_IMAGEID: "g53-hakc-llvm"
  KERNEL_IMAGEID: "g53-hakc-linux"
  REPOURL: "ett-jfrog.llan.ll.mit.edu"
  REPOID: "g0553-docker-local"
  BUILD_DIR: "cmake-build-hakc-release"
  DEPS_TO_INSTALL: "clang ninja-build cmake busybox-static lld python3-venv"
  VENV_DIR: "python/venv"
  INSTALL_DIR: "install"
  ARTIFACT_DOWNLOAD_DIR: "/tmp/llvm-artifact"
  FINAL_ARTIFACT_PATH: "install.tar.gz"

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

jobs:
  determine-llvm-build-need:
    name: Determine if LLVM needs to be built
    runs-on: [ arc-runner-set-llcad-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest
    outputs:
      rebuild: ${{ steps.rebuild.outputs.rebuild }}
      llvm_image_tag: ${{ steps.llvm_image.outputs.tag }}
      llvm_gitlink_sha: ${{ steps.llvm_sha.outputs.sha }}

    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "false"
          ref: ${{ github.sha }}

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .

      - name: Detect LLVM submodule pointer change
        id: llvm_changed
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE_PATH="llvm-project"
          
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi
          
          echo "Comparing base: $BASE_SHA  head: $HEAD_SHA"
          
          # New branch / force-push edge case
          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          base_gitlink="$(git rev-parse -q --verify "${BASE_SHA}:${SUBMODULE_PATH}" 2>/dev/null || true)"
          head_gitlink="$(git rev-parse -q --verify "${HEAD_SHA}:${SUBMODULE_PATH}" 2>/dev/null || true)"
          
          echo "Base llvm gitlink: $base_gitlink"
          echo "Head llvm gitlink: $head_gitlink"
          
          if [[ -n "$base_gitlink" && -n "$head_gitlink" && "$base_gitlink" == "$head_gitlink" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get LLVM submodule SHA (head gitlink)
        id: llvm_sha
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse -q --verify "${{ github.sha }}:llvm-project" 2>/dev/null || true)"
          if [[ -z "$sha" ]]; then
            echo "ERROR: could not read gitlink for llvm-project from ${{ github.sha }}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compute deterministic LLVM image tag
        id: llvm_image
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_TAG="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          LLVM_SHA="${{ steps.llvm_sha.outputs.sha }}"
          echo "tag=llvm-${{ runner.os }}-${BRANCH_TAG}-${LLVM_SHA}" >> "$GITHUB_OUTPUT"

      - name: Check if LLVM image exists in JFrog (registry v2)
        if: github.event_name == 'push'
        id: image_hit
        shell: bash
        env:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          REPOURL: lljfrog.llan.ll.mit.edu/ui/native
        run: |
          set -euo pipefail
          
          # Artifactory Docker Registry API (v2): check manifest existence for tag
          url="https://${{ env.REPOURL }}/${{ env.REPOID }}/${{ env.LLVM_IMAGEID }}/${{ steps.llvm_image.outputs.tag }}/manifest.json"
          echo "Checking image: $url"
          
          code="$(curl -sS -u "$jfrog_user:$jfrog_pass" \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            -o /dev/null -w '%{http_code}' -I "$url" || true)"
          
          if [[ "$code" == "200" ]]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi
          echo "http_code=$code" >> "$GITHUB_OUTPUT"

      - name: Decide whether to rebuild
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          
          # Always build+test on PRs into main/next
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            rebuild="true"
          else
            changed="${{ steps.llvm_changed.outputs.changed }}"
            hit="${{ steps.image_hit.outputs.hit }}"
          
            # If llvm pointer didn't change AND the deterministic image tag exists, skip rebuild
            if [[ "$changed" == "false" && "$hit" == "true" ]]; then
              rebuild="false"
            else
              rebuild="true"
            fi
          fi
          
          echo "rebuild=false" >> "$GITHUB_OUTPUT"
          echo "event:        ${{ github.event_name }}"
          echo "LLVM changed: ${{ steps.llvm_changed.outputs.changed }}"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Image tag:    ${{ steps.llvm_image.outputs.tag }}"
            echo "Image hit:    ${{ steps.image_hit.outputs.hit }} (HTTP ${{ steps.image_hit.outputs.http_code }})"
          fi
          echo "rebuild:      $rebuild"

  build-and-test:
    name: Build & Test
    needs: [ determine-llvm-build-need ]
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    if: needs.determine-llvm-build-need.outputs.rebuild == 'true'
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"
          ref: ${{ github.sha }}

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .

      - name: Install Dependencies
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Build Clang/LLVM
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-release
          cmake --build $BUILD_DIR -- -j $(nproc)

      - name: Run Unit Tests (check-llvm)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target check-llvm

      - name: Clean install dir (rebuild)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ env.INSTALL_DIR }}"
          mkdir -p "${{ env.INSTALL_DIR }}"

      - name: Install LLVM
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target install -- -j $(nproc)

      - name: Build & Push LLVM Image
        if: github.event_name == 'push'
        shell: bash
        env:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          DET_TAG: ${{ needs.determine-llvm-build-need.outputs.llvm_image_tag }}
          COMMIT_TAG: "amd64-${{ github.sha }}"
          LLVM_IMAGEID: ${{ env.LLVM_IMAGEID }}
        run: |
          set -euo pipefail
          
          BRANCH_TAG="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          BRANCH_LATEST_TAG="amd64-${BRANCH_TAG}-latest"
          
          echo "Deterministic tag: $DET_TAG"
          echo "Commit tag:        $COMMIT_TAG"
          echo "Branch-latest tag: $BRANCH_LATEST_TAG"
          
          envsubst < Dockerfile-llvm.template > Dockerfile
          
          export _BUILDAH_STARTED_IN_USERNS=""
          export BUILDAH_ISOLATION=chroot
          
          buildah login -u "$jfrog_user" -p "$jfrog_pass" "$REPOURL"
          
          # Build once, tag multiple times
          buildah bud --storage-driver vfs \
            -t "$REPOURL/$REPOID/$LLVM_IMAGEID:$DET_TAG" \
            -t "$REPOURL/$REPOID/$LLVM_IMAGEID:$COMMIT_TAG" \
            -t "$REPOURL/$REPOID/$LLVM_IMAGEID:$BRANCH_LATEST_TAG" \
            .
          
          # Push deterministic tag FIRST (cache key)
          buildah push --storage-driver vfs "$REPOURL/$REPOID/$LLVM_IMAGEID:$DET_TAG"
          buildah push --storage-driver vfs "$REPOURL/$REPOID/$LLVM_IMAGEID:$COMMIT_TAG"
          buildah push --storage-driver vfs "$REPOURL/$REPOID/$LLVM_IMAGEID:$BRANCH_LATEST_TAG"

  analyze-hakc-kernel:
    name: Analyze HAKC Kernel
    needs: [ determine-llvm-build-need, build-and-test ]
    if: ${{ github.event_name == 'push' && needs.determine-llvm-build-need.outputs.rebuild == 'true' }}
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/g0553-docker-local/g53-hakc-llvm:${{ needs.determine-llvm-build-need.outputs.llvm_image_tag }}

    env:
      DEPS_TO_INSTALL: "ninja-build cmake busybox-static python3-venv qemu-system"
      VENV_DIR: "python/venv"
      BUILD_DIR: "cmake-build-hakc-release"
      LINUX_ARCH: "x86_64"

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ref: ${{ github.sha }}

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Configure Environment
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-build

      - name: Generating DAG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target hakc-linux-$LINUX_ARCH-analysis

      - name: Upload DAG artifact
        uses: actions/upload-artifact@v1
        with:
          name: hakc-dag-${{ github.sha }}-${{ env.LINUX_ARCH }}
          path: ${{ env.BUILD_DIR }}/linux/${{ env.LINUX_ARCH }}/hakc-db

  build-hakc-kernel:
    name: Build HAKC Kernel
    needs: [ determine-llvm-build-need, build-and-test, analyze-hakc-kernel ]
    if: ${{ github.event_name == 'push' }}
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/g0553-docker-local/g53-hakc-llvm:${{ needs.determine-llvm-build-need.outputs.llvm_image_tag }}

    env:
      DEPS_TO_INSTALL: "ninja-build cmake busybox-static python3-venv qemu-system"
      VENV_DIR: "python/venv"
      BUILD_DIR: "cmake-build-hakc-release"
      LINUX_ARCH: "x86_64"

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ref: ${{ github.sha }}

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Download DAG artifact
        uses: actions/download-artifact@v1
        with:
          name: hakc-dag-${{ github.sha }}-${{ env.LINUX_ARCH }}
          path: ${{ env.BUILD_DIR }}/linux/${{ env.LINUX_ARCH }}/hakc-db

      - name: Configure Environment
        shell: bash
        run: |
          set -euo pipefail
          ls -al /opt
          cmake --preset ci-linux-build

      - name: Build HAKC Kernel
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target hakc-linux-$LINUX_ARCH-enforcement

      - name: Build Userspace
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target hakc-$LINUX_ARCH-userspace

      - name: Build & Push Kernel Image
        shell: bash
        env:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          COMMIT_TAG: "amd64-${{ github.sha }}"
          LATEST_TAG: "amd64-latest"
          INSTALL_DIR: "${{ env.BUILD_DIR }}/linux/${{ env.LINUX_ARCH }}"
          KERNEL_IMAGEID: ${{ env.KERNEL_IMAGEID }}
        run: |
          set -euo pipefail
          envsubst < Dockerfile-linux.template > Dockerfile
          export _BUILDAH_STARTED_IN_USERNS=""
          export BUILDAH_ISOLATION=chroot

          buildah login -u "$jfrog_user" -p "$jfrog_pass" "$REPOURL"

          buildah bud  --storage-driver vfs -t "$REPOURL/$REPOID/$KERNEL_IMAGEID:$COMMIT_TAG" .
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$KERNEL_IMAGEID:$COMMIT_TAG"

          buildah tag  --storage-driver vfs    "$REPOURL/$REPOID/$KERNEL_IMAGEID:$COMMIT_TAG" "$REPOURL/$REPOID/$KERNEL_IMAGEID:$LATEST_TAG"
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$KERNEL_IMAGEID:$LATEST_TAG"
