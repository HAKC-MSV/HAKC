name: Build, Test, and Publish LLVM

env:
  http_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  https_proxy: "http://llproxy.llan.ll.mit.edu:8080"
  no_proxy: ".llan.ll.mit.edu,localhost,127.0.0.1,172.25.4.225,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
  LLVM_IMAGEID: "g53-hakc-llvm"
  KERNEL_IMAGEID: "g53-hakc-linux"
  REPOURL: "ett-jfrog.llan.ll.mit.edu"
  REPOID: "g0553-docker-local"
  BUILD_DIR: "cmake-build-hakc-release"
  DEPS_TO_INSTALL: "clang ninja-build cmake busybox-static lld python3-venv"
  VENV_DIR: "python/venv"
  INSTALL_DIR: "hakc"
  FINAL_ARTIFACT_PATH: "/tmp/install.tar.gz"

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    outputs:
      rebuild: ${{ steps.rebuild.outputs.rebuild }}
      install_artifact_name: ${{ steps.install_art.outputs.name }}
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"
          ref: ${{ github.sha }}

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .

      - name: Detect LLVM submodule pointer change
        id: llvm_changed
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE_PATH="llvm-project"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "Comparing base: $BASE_SHA  head: $HEAD_SHA"

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_gitlink="$(git ls-tree "$BASE_SHA" "$SUBMODULE_PATH" 2>/dev/null | awk '{print $3}' || true)"
          head_gitlink="$(git ls-tree "$HEAD_SHA" "$SUBMODULE_PATH" 2>/dev/null | awk '{print $3}' || true)"

          echo "Base llvm gitlink: $base_gitlink"
          echo "Head llvm gitlink: $head_gitlink"

          if [[ -n "$base_gitlink" && -n "$head_gitlink" && "$base_gitlink" == "$head_gitlink" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get LLVM submodule SHA (head)
        id: llvm_sha
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-tree "${{ github.sha }}" llvm-project | awk '{print $3}' || true)"
          if [[ -z "$sha" ]]; then
            sha="$(git submodule status llvm-project | awk '{print $1}' | sed 's/^-//')"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compute install artifact name
        id: install_art
        shell: bash
        run: |
          set -euo pipefail
          echo "name=llvm-install-${{ runner.os }}-${{ github.ref_name }}-${{ steps.llvm_sha.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Download LLVM install artifact (if present)
        if: github.event_name == 'push'
        id: download-install
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.install_art.outputs.name }}
          path: /tmp/llvm-install-artifact

      - name: Unpack install artifact
        if: github.event_name == 'push'
        id: unpack-install
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.download-install.outcome }}" != "success" ]]; then
            echo "artifact-hit=false" >> "$GITHUB_OUTPUT"
            echo "No artifact found to restore."
            exit 0
          fi

          mkdir -p "${{ env.INSTALL_DIR }}"
          tar -xzf /tmp/llvm-install-artifact/install.tar.gz -C .
          echo "artifact-hit=true" >> "$GITHUB_OUTPUT"
          echo "Restored install directory from artifact."

      - name: Decide whether to rebuild
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail

          artifact_hit="${{ steps.unpack-install.outputs.artifact-hit }}"
          if [[ -z "$artifact_hit" ]]; then
            artifact_hit="false"
          fi

          # Always build+test on PRs into main/next
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            rebuild="true"
          else
            rebuild="${{ steps.llvm_changed.outputs.changed }}"

            # Also rebuild if artifact was NOT restored
            if [[ "$artifact_hit" != "true" ]]; then
              rebuild="true"
            fi
          fi

          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "event:        ${{ github.event_name }}"
          echo "LLVM changed: ${{ steps.llvm_changed.outputs.changed }}"
          echo "artifact-hit: $artifact_hit"
          echo "rebuild:      $rebuild"

      - name: Install Dependencies
        if: steps.rebuild.outputs.rebuild == 'true'
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Build Clang/LLVM
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-release
          cmake --build $BUILD_DIR -- -j $(nproc)

      - name: Run Unit Tests (check-llvm)
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target check-llvm

      - name: Clean install dir (rebuild)
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ env.INSTALL_DIR }}"
          mkdir -p "${{ env.INSTALL_DIR }}"

      - name: Install LLVM
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target install -- -j $(nproc)

      - name: Package install directory
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf ${{ env.FINAL_ARTIFACT_PATH }} "${{ env.INSTALL_DIR }}"

      - name: Upload LLVM install artifact
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v1
        with:
          name: ${{ steps.install_art.outputs.name }}
          path: ${{ env.FINAL_ARTIFACT_PATH }}
          if-no-files-found: error
          retention-days: 7

  publish-llvm-image:
    name: Publish Built LLVM Image
    needs: [ build-and-test ]
    if: ${{ github.event_name == 'push' && needs.build-and-test.outputs.rebuild == 'true' }}
    runs-on: [ arc-runner-set-llcad-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/isd-docker-local/ubuntu:latest

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "true"
          ref: ${{ github.sha }}

      - name: Download LLVM install artifact (from build job)
        uses: actions/download-artifact@v1
        with:
          name: ${{ needs.build-and-test.outputs.install_artifact_name }}
          path: /tmp/llvm-install-artifact

      - name: Unpack install artifact
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/llvm-install-artifact/install.tar.gz -C .
          test -d "${{ env.INSTALL_DIR }}"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .

      - name: Sanitize branch for Docker tag
        shell: bash
        run: |
          echo "BRANCH_TAG=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Build & Push Image
        shell: bash
        env:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          COMMIT_TAG: "amd64-${{ github.sha }}"
          LATEST_TAG: "amd64-${{ env.BRANCH_TAG }}-latest"
          LLVM_IMAGEID: ${{ env.LLVM_IMAGEID }}
        run: |
          set -euo pipefail
          envsubst < Dockerfile-llvm.template > Dockerfile
          export _BUILDAH_STARTED_IN_USERNS=""
          export BUILDAH_ISOLATION=chroot

          buildah login -u "$jfrog_user" -p "$jfrog_pass" "$REPOURL"

          buildah bud  --storage-driver vfs -t "$REPOURL/$REPOID/$LLVM_IMAGEID:$COMMIT_TAG" .
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$LLVM_IMAGEID:$COMMIT_TAG"

          buildah tag  --storage-driver vfs    "$REPOURL/$REPOID/$LLVM_IMAGEID:$COMMIT_TAG" "$REPOURL/$REPOID/$LLVM_IMAGEID:$LATEST_TAG"
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$LLVM_IMAGEID:$LATEST_TAG"


  analyze-hakc-kernel:
    name: Analyze HAKC Kernel
    needs: [ build-and-test, publish-llvm-image ]
    if: ${{ github.event_name == 'push' && needs.build-and-test.outputs.rebuild == 'true' }}
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/g0553-docker-local/g53-hakc-llvm:amd64-${{ github.sha }}

    env:
      DEPS_TO_INSTALL: "ninja-build cmake busybox-static python3-venv qemu-system"
      VENV_DIR: "python/venv"
      BUILD_DIR: "cmake-build-hakc-release"
      LINUX_ARCH: "x86_64"

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ref: ${{ github.sha }}

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Configure Environment
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-build

      - name: Generating DAG
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target hakc-linux-$LINUX_ARCH-analysis

      - name: Upload DAG artifact
        uses: actions/upload-artifact@v1
        with:
          name: hakc-dag-${{ github.sha }}-${{ env.LINUX_ARCH }}
          path: ${{ env.BUILD_DIR }}/linux/${{ env.LINUX_ARCH }}/hakc-db

  build-hakc-kernel:
    name: Build HAKC Kernel
    needs: [ build-and-test, publish-llvm-image, analyze-hakc-kernel ]
    if: ${{ github.event_name == 'push' && needs.build-and-test.outputs.rebuild == 'true' }}
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    container:
      image: ett-jfrog.llan.ll.mit.edu/g0553-docker-local/g53-hakc-llvm:amd64-${{ github.sha }}

    env:
      DEPS_TO_INSTALL: "ninja-build cmake busybox-static python3-venv qemu-system"
      VENV_DIR: "python/venv"
      BUILD_DIR: "cmake-build-hakc-release"
      LINUX_ARCH: "x86_64"

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ref: ${{ github.sha }}

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Download DAG artifact
        uses: actions/download-artifact@v1
        with:
          name: hakc-dag-${{ github.sha }}-${{ env.LINUX_ARCH }}
          path: ${{ env.BUILD_DIR }}/linux/${{ env.LINUX_ARCH }}/hakc-db

      - name: Configure Environment
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-linux-build

      - name: Build HAKC Kernel
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target hakc-linux-$LINUX_ARCH-enforcement

      - name: Build Userspace
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target hakc-$LINUX_ARCH-userspace

      - name: Build & Push Kernel Image
        shell: bash
        env:
          jfrog_user: ${{ secrets.JFROG_USER }}
          jfrog_pass: ${{ secrets.JFROG_PASS }}
          COMMIT_TAG: "amd64-${{ github.sha }}"
          LATEST_TAG: "amd64-latest"
          INSTALL_DIR: "${{ env.BUILD_DIR }}/linux/${{ env.LINUX_ARCH }}"
          KERNEL_IMAGEID: ${{ env.KERNEL_IMAGEID }}
        run: |
          set -euo pipefail
          envsubst < Dockerfile-linux.template > Dockerfile
          export _BUILDAH_STARTED_IN_USERNS=""
          export BUILDAH_ISOLATION=chroot

          buildah login -u "$jfrog_user" -p "$jfrog_pass" "$REPOURL"

          buildah bud  --storage-driver vfs -t "$REPOURL/$REPOID/$KERNEL_IMAGEID:$COMMIT_TAG" .
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$KERNEL_IMAGEID:$COMMIT_TAG"

          buildah tag  --storage-driver vfs    "$REPOURL/$REPOID/$KERNEL_IMAGEID:$COMMIT_TAG" "$REPOURL/$REPOID/$KERNEL_IMAGEID:$LATEST_TAG"
          buildah push --storage-driver vfs    "$REPOURL/$REPOID/$KERNEL_IMAGEID:$LATEST_TAG"
