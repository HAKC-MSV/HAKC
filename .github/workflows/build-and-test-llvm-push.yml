name: Build and Test LLVM

env:
  http_proxy: "http://llproxy.llan.llmit.edu:8080"
  https_proxy: "http://llproxy.llan.llmit.edu:8080"
  no_proxy: ".llan.llmit.edu,localhost,127.0.0.1,172.25.4.225,172.16.0.0/12,10.42.0.0/16,10.43.0.0/16"
  IMAGEID: "g53-hakc-llvm"
  REPOURL: "ett-jfrog.llan.llmit.edu"
  REPOID: "g0553-docker-local"
  BUILD_DIR: "cmake-build-hakc-release"
  DEPS_TO_INSTALL: "clang ninja-build cmake busybox-static lld python3-venv"
  VENV_DIR: "python/venv"
  INSTALL_DIR: "hakc"

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next


jobs:
  build-and-test:
    name: Build & Test
    runs-on: [ arc-runner-set-llcad-amdxl-prod ]
    container:
      image: ett-jfrog.llan.llmit.edu/isd-docker-local/ubuntu:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'true'
          ref: ${{ github.sha }}

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail
          chown -R root:root .

      - name: Detect LLVM submodule pointer change
        id: llvm_changed
        shell: bash
        run: |
          set -euo pipefail
          SUBMODULE_PATH="llvm-project"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "Comparing base: $BASE_SHA  head: $HEAD_SHA"

          if [[ -z "$BASE_SHA" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_gitlink="$(git ls-tree "$BASE_SHA" "$SUBMODULE_PATH" 2>/dev/null | awk '{print $3}' || true)"
          head_gitlink="$(git ls-tree "$HEAD_SHA" "$SUBMODULE_PATH" 2>/dev/null | awk '{print $3}' || true)"

          echo "Base llvm gitlink: $base_gitlink"
          echo "Head llvm gitlink: $head_gitlink"

          if [[ -n "$base_gitlink" && -n "$head_gitlink" && "$base_gitlink" == "$head_gitlink" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get LLVM submodule SHA (head)
        id: llvm_sha
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-tree "${{ github.sha }}" llvm-project | awk '{print $3}' || true)"
          if [[ -z "$sha" ]]; then
            sha="$(git submodule status llvm-project | awk '{print $1}' | sed 's/^-//')"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Try restore LLVM install from artifact
        id: restore-install
        shell: bash
        run: |
          set -euo pipefail
          echo "name=llvm-install-${{ runner.os }}-${{ github.ref_name }}-${{ steps.llvm_sha.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - name: Download LLVM install artifact (if present)
        id: download-install
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ steps.restore-install.outputs.name }}
          path: /tmp/llvm-install-artifact

      - name: Unpack install artifact
        id: unpack-install
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.download-install.outcome }}" != "success" ]]; then
            echo "artifact-hit=false" >> "$GITHUB_OUTPUT"
            echo "No artifact found to restore."
            exit 0
          fi

          mkdir -p "${{ env.INSTALL_DIR }}"
          tar -xzf /tmp/llvm-install-artifact/install.tar.gz -C .
          echo "artifact-hit=true" >> "$GITHUB_OUTPUT"
          echo "Restored install directory from artifact."

      - name: Decide whether to rebuild
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail

          rebuild="${{ steps.llvm_changed.outputs.changed }}"

          # Also rebuild if artifact was NOT restored
          if [[ "${{ steps.unpack-install.outputs.artifact-hit }}" != "true" ]]; then
            rebuild="true"
          fi

          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
          echo "LLVM changed:  ${{ steps.llvm_changed.outputs.changed }}"
          echo "artifact-hit:  ${{ steps.unpack-install.outputs.artifact-hit }}"
          echo "rebuild:       $rebuild"

      - name: Install Dependencies
        if: steps.rebuild.outputs.rebuild == 'true'
        run: |
          apt update
          apt install -y $DEPS_TO_INSTALL

      - name: Build Clang/LLVM
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cmake --preset ci-release
          cmake --build $BUILD_DIR -- -j $(nproc)

      - name: Run Unit Tests (check-llvm)
        if: steps.rebuild.outputs.rebuild == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv $VENV_DIR
          source $VENV_DIR/bin/activate
          pip install -r llvm-project/llvm/utils/hakc/requirements.txt
          cmake --build $BUILD_DIR --target check-llvm

      - name: Clean install dir (rebuild)
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ env.INSTALL_DIR }}"
          mkdir -p "${{ env.INSTALL_DIR }}"

      - name: Install LLVM
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build $BUILD_DIR --target install -- -j $(nproc)

      - name: Package install directory
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          tar -czf /tmp/install.tar.gz "${{ env.INSTALL_DIR }}"

      - name: Upload LLVM install artifact
        if: steps.rebuild.outputs.rebuild == 'true' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.restore-install.outputs.name }}
          path: /tmp/install.tar.gz
          if-no-files-found: error
          retention-days: 7
