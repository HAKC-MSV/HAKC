build_linux_v5-armv9_rosdemo_compartmentalized_kernel-job:
  stage: build_v5
  needs:
    - job: build_linux-armv9_pass-job
    - job: build_linux_v5-armv9_kernel_dag-job
    - job: linux_v5-armv9_rosdemo_dag_adjustment-job
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $MAIN_BRANCH
    - if: $CI_COMMIT_BRANCH == $STAGING_BRANCH
    - if: $CI_COMMIT_BRANCH == $MAIN_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $NEXT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $DEV_BRANCH && $CI_COMMIT_BRANCH !~ $EXT_BRANCH # manual build for internal dev branches
      when: on_success # Will run once dag_analysis has completed
  variables:
    BUILD_TYPE: "linux-armv9"
    HAKC_DAG_ROOT: "build-$BUILD_TYPE/hakc-dag-analysis"
    MODULES_ROOT: "modules-$BUILD_TYPE"
  script:
    - export CLANG_BUILD_PATH="$HAKC_CLANG_PATH/build/$CI_COMMIT_BRANCH/"
    - export CLANG_DEPLOY_PATH="$HAKC_CLANG_PATH/deploy/"
    - echo "Checking which clang to use"
    - |
      if [ -d "$CLANG_BUILD_PATH" ]; then
        export CLANG_PATH=$(realpath $CLANG_BUILD_PATH)
      else
        export CLANG_PATH=$(realpath $CLANG_DEPLOY_PATH)
      fi
    - echo "Using $CLANG_PATH"
    - mkdir -p $MODULES_ROOT
    - export ROOT_ROOT=`pwd`
    - |
      if [ -d $ROOT_ROOT/linux ]; then
        cd $ROOT_ROOT/linux
        git checkout -- . || echo "checkout clear"
        git clean -f -d || echo "clean clear"
        git checkout v5.15 || echo "checkout version"
        cd $ROOT_ROOT
      fi
    - GIT_CURL_VERBOSE=1 GIT_TRACE=1 git submodule init linux
    - GIT_CURL_VERBOSE=1 GIT_TRACE=1 git submodule update
    - cd $ROOT_ROOT/linux
    - git checkout -- .
    - git clean -f -d
    - git checkout v5.15
    - cd $ROOT_ROOT
    - echo "returning to $ROOT_ROOT after patching"
    - cd scripts/patch-generation
    - ./apply_v515_patches.sh
    - cd $ROOT_ROOT/linux
    - echo "Building kernel"
    - export PATH=$CLANG_PATH/bin:$PATH
    - |
      cd $ROOT_ROOT
      export DEMO_NAME="rosdemo"
      cd HAKC-pass
      IFS=' ' read -ra pass_commit_string_array <<< `git log src | head -n 1`
      export PASS_ID=${pass_commit_string_array[1]:0:8}
      cd ..
      cd linux-patches/v5.15
      IFS=' ' read -ra patchset_commit_string_array <<< `git log . | head -n 1`
      export PATCHSET_ID=${patchset_commit_string_array[1]:0:8}
      cd ../..
      # after config generated
      cd build-$BUILD_TYPE
      IFS=' ' read -ra config_hash_string_array <<< `sha256sum .config | head -n 1`
      export CONFIG_ID=${config_hash_string_array[0]:0:8}
      cd ..
      cd scripts/ros2-demo
      IFS=' ' read -ra adjyml_hash_string_array <<< `sha256sum rosdemo-compartments.yml | head -n 1`
      export ADJYML_ID=${adjyml_hash_string_array[0]:0:8}
      cd ../..
      export ARTIFACT_PATH="/data/gitlab-runner/artifact_stage/$BUILD_TYPE/$DEMO_NAME/$PASS_ID/$PATCHSET_ID/$CONFIG_ID/$ADJYML_ID/modules-$BUILD_TYPE"
      if [ -d $ARTIFACT_PATH ]; then
        # this dag has been generated previously, copy HAKC_DAG_ROOT and config into expected location
        cp -r $ARTIFACT_PATH/../build-$BUILD_TYPE .
        cp -r $ARTIFACT_PATH/../modules-$BUILD_TYPE .
        exit 0
      else
        echo "this has not been done before, continuing with build"
      fi
      cd $ROOT_ROOT/linux
    - |
      env HAKC_ANALYSIS=compartmentalize \
      HAKC_COMPARTMENT_PATH=$(realpath ../$HAKC_DAG_ROOT/hakc-compartments.yml) \
      HAKC_SOURCE_PATH=$PWD \
      HAKC_BUILD_PATH=$(realpath ../build-$BUILD_TYPE) \
      make \
      ARCH=arm64 \
      CROSS_COMPILE=aarch64-linux-gnu- \
      LLVM=1 \
      O=$(realpath ../build-$BUILD_TYPE) \
      INSTALL_MOD_PATH=$(realpath ../modules-$BUILD_TYPE) \
      CC=$CLANG_PATH/bin/clang \
      HOSTCC=$CLANG_PATH/bin/clang \
      LOCALVERSION=$BUILD_TYPE \
      -j$BUILD_PROCESSORS clean
    - |
      env HAKC_ANALYSIS=compartmentalize \
      HAKC_COMPARTMENT_PATH=$(realpath ../$HAKC_DAG_ROOT/hakc-compartments.yml) \
      make \
      ARCH=arm64 \
      CROSS_COMPILE=aarch64-linux-gnu- \
      LLVM=1 \
      O=$(realpath ../build-$BUILD_TYPE) \
      INSTALL_MOD_PATH=$(realpath ../modules-$BUILD_TYPE) \
      CC=$CLANG_PATH/bin/clang \
      HOSTCC=$CLANG_PATH/bin/clang \
      LOCALVERSION=$BUILD_TYPE \
      -j$BUILD_PROCESSORS
    - |
      env HAKC_ANALYSIS=compartmentalize \
      HAKC_COMPARTMENT_PATH=$(realpath ../$HAKC_DAG_ROOT/hakc-compartments.yml) \
      make \
      ARCH=arm64 \
      CROSS_COMPILE=aarch64-linux-gnu- \
      LLVM=1 \
      O=$(realpath ../build-$BUILD_TYPE) \
      INSTALL_MOD_PATH=$(realpath ../modules-$BUILD_TYPE) \
      CC=$CLANG_PATH/bin/clang \
      HOSTCC=$CLANG_PATH/bin/clang \
      LOCALVERSION=$BUILD_TYPE \
      -j$BUILD_PROCESSORS modules_install
    # copy to artifact stage area
    - cd $ROOT_ROOT
    - mkdir -p $ARTIFACT_PATH
    - mkdir -p $ARTIFACT_PATH/../build-$BUILD_TYPE
    - cp -r modules-$BUILD_TYPE $ARTIFACT_PATH/..
    - cp -r build-$BUILD_TYPE $ARTIFACT_PATH/..
    # get source back into good shape for future v6 builds
    - cd $ROOT_ROOT/linux
    - git checkout -- .
    - git clean -f -d
    - git checkout v6.6
  artifacts:
    paths:
      - build-$BUILD_TYPE
      - modules-$BUILD_TYPE
  dependencies:
    - build_linux-armv9_pass-job
    - build_linux_v5-armv9_kernel_dag-job
    - linux_v5-armv9_rosdemo_dag_adjustment-job
