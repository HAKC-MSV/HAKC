!HAKCAdjustments
add-kernel-division: true
compartmentalize:
  - !HAKCAdjustmentOnPath
    path: 'linux/drivers/rosdemo/rosdemo\-leaker.c'
    division_id: 1
    compartment_id: 2048
  - !HAKCAdjustmentOnPath
    path: 'linux/drivers/rosdemo/rosdemo\-consumer.c'
    division_id: 2
    compartment_id: 1024
  - !HAKCAdjustmentOnSymbol
    path: 'linux/drivers/rosdemo/rosdemo\-consumer.c'
